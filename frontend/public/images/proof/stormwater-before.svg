<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="sky1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="sludge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3E2723"/>
      <stop offset="100%" stop-color="#1B100E"/>
    </linearGradient>
    <linearGradient id="concrete" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#sky1)"/>
  <!-- Canal Concrete Banks -->
  <polygon points="0,180 800,180 800,450 0,450" fill="#334155"/>
  <polygon points="80,180 180,450 620,450 720,180" fill="url(#concrete)"/>
  <polygon points="180,260 220,450 580,450 620,260" fill="#1E293B"/>
  <!-- Stagnant Sludge and Sewage -->
  <path d="M 200,320 Q 400,310 600,325 L 610,450 L 190,450 Z" fill="url(#sludge)"/>
  <!-- Plastic Debris & Trash Buildup -->
  <ellipse cx="320" cy="340" rx="45" ry="15" fill="#EF4444" opacity="0.9"/>
  <ellipse cx="460" cy="350" rx="55" ry="18" fill="#3B82F6" opacity="0.9"/>
  <ellipse cx="390" cy="330" rx="40" ry="14" fill="#F59E0B" opacity="0.9"/>
  <ellipse cx="270" cy="360" rx="35" ry="12" fill="#FFFFFF" opacity="0.8"/>
  <ellipse cx="510" cy="370" rx="50" ry="15" fill="#10B981" opacity="0.8"/>
  <path d="M 330,310 L 370,330 L 350,345 Z" fill="#E2E8F0"/>
  <path d="M 430,320 L 460,335 L 440,350 Z" fill="#FDE047"/>
  <!-- Warning Badge -->
  <rect x="30" y="30" width="220" height="42" rx="10" fill="#DC2626"/>
  <text x="140" y="56" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="900" text-anchor="middle" letter-spacing="1">BLOCKED CULVERT</text>
  <!-- Hazard Sign -->
  <circle cx="720" cy="60" r="26" fill="#EF4444" stroke="#FFFFFF" stroke-width="3"/>
  <text x="720" y="70" fill="#FFFFFF" font-family="sans-serif" font-size="28" font-weight="bold" text-anchor="middle">!</text>
</svg>
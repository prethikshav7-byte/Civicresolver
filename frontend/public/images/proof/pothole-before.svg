<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <radialGradient id="crater" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="70%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#475569"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#road)"/>
  <!-- Road Lane White Dashes -->
  <line x1="0" y1="80" x2="800" y2="80" stroke="#F8FAFC" stroke-width="12" stroke-dasharray="60 40" opacity="0.7"/>
  <line x1="0" y1="380" x2="800" y2="380" stroke="#F8FAFC" stroke-width="12" stroke-dasharray="60 40" opacity="0.7"/>
  <!-- Deep Crater Depression with ragged fractures -->
  <ellipse cx="400" cy="230" rx="180" ry="90" fill="url(#crater)"/>
  <path d="M 230,220 Q 210,180 180,170 M 570,230 Q 610,210 650,220 M 410,320 Q 420,360 450,380 M 350,140 Q 330,110 320,90" stroke="#0F172A" stroke-width="5" fill="none"/>
  <!-- Exposed Aggregate Rocks & pooled dirty water -->
  <ellipse cx="380" cy="240" rx="100" ry="40" fill="#475569" opacity="0.9"/>
  <circle cx="340" cy="235" r="12" fill="#94A3B8"/>
  <circle cx="420" cy="250" r="15" fill="#64748B"/>
  <circle cx="450" cy="225" r="10" fill="#94A3B8"/>
  <circle cx="310" cy="245" r="9" fill="#CBD5E1"/>
  <!-- Warning Badge -->
  <rect x="30" y="30" width="220" height="42" rx="10" fill="#DC2626"/>
  <text x="140" y="56" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="900" text-anchor="middle" letter-spacing="1">ROAD CAVITATION</text>
  <circle cx="720" cy="60" r="26" fill="#DC2626" stroke="#FFFFFF" stroke-width="3"/>
  <text x="720" y="70" fill="#FFFFFF" font-family="sans-serif" font-size="28" font-weight="bold" text-anchor="middle">!</text>
</svg>
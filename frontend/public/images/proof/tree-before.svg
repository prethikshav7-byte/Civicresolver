<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#D1FAE5"/>
  <!-- Brick Red Jogging Track -->
  <rect x="0" y="140" width="800" height="170" fill="#B91C1C"/>
  <!-- Jogging Track Lines -->
  <line x1="0" y1="225" x2="800" y2="225" stroke="#FFFFFF" stroke-width="4" stroke-dasharray="25 15"/>
  <!-- Fallen Massive Banyan Timber blocking the track -->
  <path d="M 160,280 Q 380,180 620,240 L 640,290 Q 390,240 180,340 Z" fill="#5C3A21"/>
  <!-- Broken boughs & leafy debris -->
  <ellipse cx="320" cy="200" rx="60" ry="35" fill="#15803D" opacity="0.9"/>
  <ellipse cx="440" cy="220" rx="75" ry="40" fill="#166534" opacity="0.9"/>
  <ellipse cx="540" cy="260" rx="50" ry="30" fill="#15803D" opacity="0.8"/>
  <!-- Barrier Tape -->
  <line x1="120" y1="130" x2="680" y2="320" stroke="#EAB308" stroke-width="8" stroke-dasharray="20 15"/>
  <!-- Warning Badge -->
  <rect x="30" y="30" width="220" height="42" rx="10" fill="#DC2626"/>
  <text x="140" y="56" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="900" text-anchor="middle" letter-spacing="1">PATHWAY BLOCKED</text>
  <circle cx="720" cy="60" r="26" fill="#DC2626" stroke="#FFFFFF" stroke-width="3"/>
  <text x="720" y="70" fill="#FFFFFF" font-family="sans-serif" font-size="28" font-weight="bold" text-anchor="middle">!</text>
</svg>
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: civicresolve-backend
  labels:
    cloud.google.com/location: asia-south1
spec:
  template:
    metadata:
      annotations:
        # Scale to zero when idle to minimize costs (request-based billing)
        autoscaling.knative.dev/minScale: "0"
        # Strict cost guardrail: limit maximum instances
        autoscaling.knative.dev/maxScale: "3"
        # CPU allocation only during request processing
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/execution-environment: gen2
    spec:
      containerConcurrency: 80
      timeoutSeconds: 60
      containers:
        - image: gcr.io/PROJECT_ID/civicresolve-backend:latest
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1000m"
              memory: "512Mi"
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: PORT
              value: "8080"
            - name: CORS_ORIGINS
              value: "https://civicresolver.vercel.app,https://civicresolve.vercel.app"
            - name: CITY_FOCUS
              value: "Coimbatore"
            - name: GEMINI_MODEL
              value: "gemini-2.5-flash"
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 15
